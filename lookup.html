<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>윤담 - 예약조회</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="윤담">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top-bar">
  <img class="logo-icon" src="assets/icon-192.png" alt="윤담">
  <span class="brand-font">윤담</span>
  <nav>
    <a href="index.html">예약</a>
    <a href="menu.html">메뉴</a>
    <a href="lookup.html" class="active">예약조회</a>
  </nav>
</header>
<main class="container">
  <h1 class="page-title">예약 조회 / 취소</h1>

  <div class="card" id="searchCard">
    <label>예약번호 또는 전화번호</label>
    <p class="hint" style="margin:-6px 0 10px;">예약번호(R로 시작) 또는 예약하실 때 입력하신 전화번호 중 하나만 입력해 주세요.</p>
    <input type="text" id="keyInput" placeholder="예: R20260815-001 또는 010-1234-5678">
    <div id="err" class="error-box" style="display:none;"></div>
    <button class="btn-primary" id="searchBtn">조회하기</button>
  </div>

  <div class="card" id="listCard" style="display:none;">
    <p class="hint" style="margin-bottom:10px;">일치하는 예약이 여러 건입니다. 확인하실 예약을 눌러주세요.</p>
    <div id="listWrap"></div>
  </div>

  <div class="card result-box" id="resultCard" style="display:none;">
    <div class="row"><span>예약번호</span><b id="rNum"></b></div>
    <div class="row"><span>날짜</span><b id="rDate"></b></div>
    <div class="row"><span>시간</span><b id="rTime"></b></div>
    <div class="row"><span>인원</span><b id="rParty"></b></div>
    <div class="row"><span>예약자</span><b id="rName"></b></div>
    <div class="row"><span>상태</span><b id="rStatus"></b></div>
    <button class="btn-primary btn-danger" id="cancelBtn" style="margin-top:18px;">예약 취소하기</button>
  </div>
</main>

<footer class="site-footer">
  <p><b>윤담</b></p>
  <p>경기 수원시 영통구 봉영로 1587 110호 (경기 수원시 영통구 영통동 959-4) · 우편번호 16703</p>
  <p>수인분당선 영통역 8번 출구에서 185m</p>
  <p>전화문의: 0507-1302-3890</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/booking.js"></script>
<script>
let currentReservation = null;

document.getElementById("searchBtn").addEventListener("click", async () => {
  const key = document.getElementById("keyInput").value.trim();
  const err = document.getElementById("err");
  err.style.display = "none";
  document.getElementById("listCard").style.display = "none";
  document.getElementById("resultCard").style.display = "none";

  if (!key) { err.textContent = "예약번호 또는 전화번호를 입력해 주세요."; err.style.display = "block"; return; }

  const btn = document.getElementById("searchBtn");
  btn.disabled = true; btn.textContent = "조회중...";

  const looksLikeReservationNumber = /^r/i.test(key);

  if (looksLikeReservationNumber) {
    const found = await findReservationByNumber(key);
    btn.disabled = false; btn.textContent = "조회하기";
    if (!found) { err.textContent = "일치하는 예약을 찾을 수 없습니다. 다시 확인해 주세요."; err.style.display = "block"; return; }
    showResult(found);
  } else {
    const list = await findReservationsByPhone(key);
    btn.disabled = false; btn.textContent = "조회하기";
    if (list.length === 0) { err.textContent = "일치하는 예약을 찾을 수 없습니다. 다시 확인해 주세요."; err.style.display = "block"; return; }
    if (list.length === 1) { showResult(list[0]); return; }
    showList(list);
  }
});

function showList(list) {
  const wrap = document.getElementById("listWrap");
  wrap.innerHTML = "";
  list.forEach((r) => {
    const row = document.createElement("div");
    row.className = "res-row";
    row.style.cursor = "pointer";
    row.innerHTML = `
      <span class="time">${formatDateKorean(r.date)} ${r.startTime}</span>
      <span class="info"><b>${r.customerName}</b> · ${r.partySize}명 <span class="badge">${r.status}</span></span>
    `;
    row.addEventListener("click", () => showResult(r));
    wrap.appendChild(row);
  });
  document.getElementById("listCard").style.display = "block";
}

function showResult(found) {
  currentReservation = found;
  document.getElementById("listCard").style.display = "none";
  document.getElementById("rNum").textContent = found.reservationNumber;
  document.getElementById("rDate").textContent = formatDateKorean(found.date);
  document.getElementById("rTime").textContent = found.startTime;
  document.getElementById("rParty").textContent = found.partySize + "명";
  document.getElementById("rName").textContent = found.customerName;
  document.getElementById("rStatus").textContent = found.status;
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("cancelBtn").style.display = CLOSED_STATUSES.includes(found.status) ? "none" : "block";
}

document.getElementById("cancelBtn").addEventListener("click", async () => {
  if (!currentReservation) return;
  if (!confirm("정말 예약을 취소하시겠습니까?")) return;
  await cancelReservationByCustomer(currentReservation.id);
  alert("예약이 취소되었습니다.");
  location.reload();
});
</script>
</body>
</html>
