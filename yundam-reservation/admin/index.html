<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>윤담 관리자 로그인</title>
<link rel="icon" href="../assets/favicon.ico">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="container">
  <div class="login-box">
    <img src="../assets/icon-192.png" alt="윤담">
    <h1 class="page-title brand-font" style="font-size:26px;">윤담 관리자</h1>
    <div class="card" style="text-align:left;">
      <label>이메일</label>
      <input type="text" id="email" placeholder="admin@yundam.com">
      <label>비밀번호</label>
      <input type="text" id="password" placeholder="비밀번호" style="-webkit-text-security:disc;">
      <div id="err" class="error-box" style="display:none;"></div>
      <button class="btn-primary" id="loginBtn">로그인</button>
    </div>
    <p class="hint">계정이 없으면 Firebase 콘솔 &gt; Authentication에서 이메일/비밀번호로 사용자를 먼저 추가해 주세요.</p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script>
auth.onAuthStateChanged((user) => { if (user) location.href = "today.html"; });

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const err = document.getElementById("err");
  err.style.display = "none";
  try {
    await auth.signInWithEmailAndPassword(email, password);
    location.href = "today.html";
  } catch (e) {
    err.textContent = "로그인 실패: 이메일 또는 비밀번호를 확인해 주세요.";
    err.style.display = "block";
  }
});
</script>
</body>
</html>
