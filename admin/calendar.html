<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>윤담 관리자 - 예약 조회</title>
<link rel="icon" href="../assets/favicon.ico">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="top-bar">
  <img class="logo-icon" src="../assets/icon-192.png" alt="윤담">
  <span class="brand-font">윤담 관리자</span>
  <nav>
    <a href="today.html">오늘</a>
    <a href="calendar.html" class="active">예약 조회</a>
    <a href="tablemap.html">테이블맵</a>
    <a href="fix.html">데이터 정리</a>
    <a href="#" onclick="logout()">로그아웃</a>
  </nav>
</header>

<main class="container wide">
  <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
    <button class="btn-secondary" id="prevDay">◀ 전날</button>
    <input type="date" id="dateInput">
    <button class="btn-secondary" id="nextDay">다음날 ▶</button>
    <button class="btn-secondary" id="gotoToday">오늘</button>
  </div>

  <h1 class="page-title" id="dateTitle">예약 조회</h1>

  <div class="dash-grid">
    <div class="dash-card" style="background:#4A90D9;"><div class="num" id="cTotal">0</div><div class="label">전체</div></div>
    <div class="dash-card" style="background:#E8963B;"><div class="num" id="cActive">0</div><div class="label">이용중</div></div>
    <div class="dash-card" style="background:#7FB069;"><div class="num" id="cDone">0</div><div class="label">완료</div></div>
    <div class="dash-card" style="background:#767676;"><div class="num" id="cRest">0</div><div class="label">취소/노쇼</div></div>
  </div>

  <div id="resList"></div>
</main>

<div class="fab-row">
  <button onclick="openModal()">+ 전화 예약</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2 class="section-title">전화 예약 등록</h2>
    <label>날짜</label>
    <input type="date" id="mDate">
    <label>시간</label>
    <select id="mTime"></select>
    <label>인원</label>
    <input type="text" id="mParty" placeholder="숫자만 입력 (예: 4)">
    <label>이름</label>
    <input type="text" id="mName">
    <label>전화번호</label>
    <input type="tel" id="mPhone">
    <label>요청사항 (선택)</label>
    <textarea id="mNote" rows="2"></textarea>
    <div id="mManualWrap" style="display:none;">
      <label>5명 이상은 테이블을 직접 선택해 주세요</label>
      <div id="mTableChecks" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;"></div>
    </div>
    <div id="mErr" class="error-box" style="display:none;"></div>
    <button class="btn-primary" id="mSubmit">등록하기</button>
    <button class="btn-secondary" style="width:100%; margin-top:8px;" onclick="closeModal()">취소</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/common.js"></script>
<script src="../js/booking.js"></script>
<script src="../js/admin.js"></script>
<script>
let selectedDate = todayStr();
let currentQueryRef = null;

requireLogin(() => {
  document.getElementById("dateInput").value = selectedDate;
  document.getElementById("dateInput").min = "";
  listenDate(selectedDate);
});

document.getElementById("dateInput").addEventListener("change", (e) => {
  if (!e.target.value) return;
  selectedDate = e.target.value;
  listenDate(selectedDate);
});
document.getElementById("prevDay").addEventListener("click", () => {
  selectedDate = shiftDate(selectedDate, -1);
  document.getElementById("dateInput").value = selectedDate;
  listenDate(selectedDate);
});
document.getElementById("nextDay").addEventListener("click", () => {
  selectedDate = shiftDate(selectedDate, 1);
  document.getElementById("dateInput").value = selectedDate;
  listenDate(selectedDate);
});
document.getElementById("gotoToday").addEventListener("click", () => {
  selectedDate = todayStr();
  document.getElementById("dateInput").value = selectedDate;
  listenDate(selectedDate);
});

function shiftDate(dateStr, deltaDays) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + deltaDays);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}

function listenDate(date) {
  if (currentQueryRef) currentQueryRef.off();
  document.getElementById("dateTitle").textContent =
    (date === todayStr() ? "오늘 · " : "") + formatDateKorean(date);
  currentQueryRef = db.ref("reservations").orderByChild("date").equalTo(date);
  currentQueryRef.on("value", (snap) => {
    const list = [];
    snap.forEach((child) => { list.push({ id: child.key, ...child.val() }); });
    list.sort((a, b) => (a.startTime > b.startTime ? 1 : -1));
    renderList(list);
    renderCounts(list);
  });
}

function renderCounts(list) {
  document.getElementById("cTotal").textContent = list.length;
  document.getElementById("cActive").textContent = list.filter((r) => ["도착","착석","이용중"].includes(r.status)).length;
  document.getElementById("cDone").textContent = list.filter((r) => r.status === "완료").length;
  document.getElementById("cRest").textContent = list.filter((r) => ["취소","노쇼"].includes(r.status)).length;
}

function renderList(list) {
  const wrap = document.getElementById("resList");
  wrap.innerHTML = "";
  if (list.length === 0) { wrap.innerHTML = '<p class="hint">이 날짜엔 예약이 없습니다.</p>'; return; }
  list.forEach((r) => {
    const row = document.createElement("div");
    row.className = "res-row";
    const tables = (r.tableIds || []).join("+");
    row.innerHTML = `
      <span class="time">${r.startTime}</span>
      <span class="info"><b>${r.customerName}</b> · ${r.partySize}명 · ${tables} <span class="badge ${STATUS_COLOR_CLASS[r.status] || ''}">${r.status}</span></span>
      <select class="status-select" data-id="${r.id}">
        ${STATUS_LIST.map((s) => `<option value="${s}" ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      ${!["완료","취소","노쇼"].includes(r.status) ? `<button class="quick-done" data-id="${r.id}">바로 종료</button>` : ""}
      <button class="table-change-btn" data-id="${r.id}" data-tables="${(r.tableIds||[]).join(',')}">테이블변경</button>
      <button class="delete-btn" data-id="${r.id}">삭제</button>
    `;
    wrap.appendChild(row);
  });

  wrap.querySelectorAll(".status-select").forEach((sel) => {
    sel.addEventListener("change", async (e) => {
      await changeReservationStatus(e.target.dataset.id, e.target.value);
    });
  });
  wrap.querySelectorAll(".quick-done").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      if (!confirm("이 예약을 지금 완료 처리하고 테이블을 바로 반납할까요?")) return;
      await changeReservationStatus(e.target.dataset.id, "완료");
    });
  });
  wrap.querySelectorAll(".table-change-btn").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      const id = e.target.dataset.id;
      const current = e.target.dataset.tables;
      const input = prompt("새 테이블 번호를 입력해 주세요 (쉼표로 구분)\n예: T2  또는 C1,C2", current);
      if (!input) return;
      const newTables = input.split(",").map((s) => s.trim().toUpperCase()).filter(Boolean);
      const validIds = ALL_TABLES.map((t) => t.id);
      const invalid = newTables.filter((t) => !validIds.includes(t));
      if (invalid.length > 0) { alert("존재하지 않는 테이블 번호입니다: " + invalid.join(", ")); return; }
      const result = await changeReservationTable(id, newTables);
      if (!result.success) { alert(result.message); return; }
      alert("테이블이 변경되었습니다.");
    });
  });
  wrap.querySelectorAll(".delete-btn").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      if (!confirm("이 예약을 완전히 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) return;
      await deleteReservation(e.target.dataset.id);
    });
  });
}

// ---------- 전화예약 등록 모달 ----------
function openModal() {
  document.getElementById("mErr").style.display = "none";
  document.getElementById("mDate").value = selectedDate;
  document.getElementById("mDate").min = todayStr();
  document.getElementById("mParty").value = "";
  document.getElementById("mName").value = "";
  document.getElementById("mPhone").value = "";
  document.getElementById("mNote").value = "";
  document.getElementById("mManualWrap").style.display = "none";
  fillTimeOptions();
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }

function fillTimeOptions() {
  const sel = document.getElementById("mTime");
  sel.innerHTML = "";
  generateTimeSlots().forEach((t) => {
    const opt = document.createElement("option");
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  });
}

document.getElementById("mParty").addEventListener("input", (e) => {
  const n = parseInt(e.target.value, 10);
  document.getElementById("mManualWrap").style.display = n >= 5 ? "block" : "none";
  if (n >= 5) {
    const wrap = document.getElementById("mTableChecks");
    wrap.innerHTML = "";
    ALL_TABLES.forEach((t) => {
      const label = document.createElement("label");
      label.style.cssText = "display:flex;align-items:center;gap:4px;font-size:13px;width:auto;margin:0;";
      label.innerHTML = `<input type="checkbox" value="${t.id}" style="width:auto;margin:0;"> ${t.id}(${t.capacity}인)`;
      wrap.appendChild(label);
    });
  }
});

document.getElementById("mSubmit").addEventListener("click", async () => {
  const err = document.getElementById("mErr");
  err.style.display = "none";
  const party = parseInt(document.getElementById("mParty").value, 10);
  const name = document.getElementById("mName").value;
  const phone = document.getElementById("mPhone").value;
  const note = document.getElementById("mNote").value;
  const date = document.getElementById("mDate").value;
  const time = document.getElementById("mTime").value;

  if (!party || party < 1) { err.textContent = "인원을 입력해 주세요."; err.style.display = "block"; return; }

  let forcedGroup = null;
  if (party >= 5) {
    forcedGroup = [...document.querySelectorAll("#mTableChecks input:checked")].map((c) => c.value);
    if (forcedGroup.length === 0) { err.textContent = "테이블을 1개 이상 선택해 주세요."; err.style.display = "block"; return; }
  }

  const btn = document.getElementById("mSubmit");
  btn.disabled = true; btn.textContent = "처리중...";
  const result = await attemptReservation({
    date, startTime: time, partySize: party, name, phone, note,
    source: "phone", forcedGroup,
  });
  btn.disabled = false; btn.textContent = "등록하기";

  if (!result.success) { err.textContent = result.message; err.style.display = "block"; return; }
  closeModal();
});
</script>
</body>
</html>
